<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Deshboard</title>
</head>
<body>
    <div class="container">
        <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
        <div class="sidebar">
            <ul>
                <li>
                    <a href="../html/deshboard.html" class="nav-link">
                        <span class="item-icon">
                            <i class='bx bxs-home'></i>
                        </span>
                        <span class="item-text">หน้าหลัก</span>
                    </a>
                </li>
                <li>
                    <a href="#" class="nav-link">
                        <span class="item-icon">
                            <i class='bx bxs-user'></i>
                        </span>
                        <span class="item-text">ข้อมูลส่วนตัว</span>
                    </a>
                </li>
                <li>
                    <a href="../html/submit-project.html" class="nav-link">
                        <span class="item-icon">
                            <i class='bx bx-send'></i>
                        </span>
                        <span class="item-text">ยื่นโครงงาน</span>
                    </a>
                </li>
                <li>
                    <a href="../html/submit-project.html" class="nav-link">
                        <span class="item-icon">
                            <i class='bx bx-line-chart'></i>
                        </span>
                        <span class="item-text">ความก้าวหน้าโครงงาน</span>
                    </a>
                </li>
                 <li>
                    <a href="../html/gallery.html" class="nav-link">
                        <span class="item-icon">
                            <i class='bx bx-help-circle'></i>
                        </span>
                        <span class="item-text">คู่มือ</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <div class="dashboard">
        <div class="header">
            <img src="../images/images1.png" class="logo" alt="logo">
            <div class="header-right">
                <div class="search-box">
                    <input type="text" placeholder="Search...">
                    <button type="submit"><i class="fa fa-search"></i></button>
                </div>
                <span>Guest</span>
                <div class="profile-icon">
                     <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="white">
                        <path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 
                                2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 
                                1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"/>
                     </svg>
                </div>
            </div>
        </div>

        <div class="welcome">
            <div class="welcome-text">
                <h3>Welcome to Project go!</h3>
                <p>Ready to start your day with some quick details?</p>
            </div>
            <img src="../images/images2.png" alt="Illustration">
        </div>

        <div class="stats">
            <div class="stat yellow" id="stat1"></div>
            <div class="stat purple" id="stat2"></div>
            <div class="stat pink" id="stat3"></div>
            <div class="stat blue" id="stat4"></div>
        </div>

        <div class="tasks">
            <h4>หน้าแรก</h4>
            <div class="task">
                <img src="https://via.placeholder.com/50" alt="task1">
                <div class="task-info">
                    <h5>Watch a Video</h5>
                    <p>20 Mins</p>
                </div>
            </div>
            <div class="task">
                <img src="https://via.placeholder.com/50" alt="task2">
                <div class="task-info">
                    <h5>Digital Marketing Essay</h5>
                    <p>50 Mins</p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function updateStats(data) {
            document.getElementById("stat1").innerText = data.progress + "% Progress";
            document.getElementById("stat2").innerText = data.complete + "% Complete";
            document.getElementById("stat3").innerText = data.tasks + " Tasks";
            document.getElementById("stat4").innerText = data.projects + " Projects";
        }

        updateStats({
          progress: 0,
          complete: 0,
          tasks: 0,
          projects: 0
        });
    </script>
</body>
</html>
