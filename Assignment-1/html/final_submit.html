    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <div class="dashboard">
        <div class="header">
            <img src="../images/images1.png" class="logo" alt="logo">
            <div class="header-right">
                <span>Guest</span>
                <div class="profile-icon">
                     <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="white">
                        <path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5

                                1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"/>
                     </svg>
                </div>
            </div>
        </div>
        
        <div class="boxs">
            <a href="../html/final_submit.html"><div class="black-box">ยื่นสอบจบ</div></a>
            <a href="../html/date_time_room.html"><div class="black-box">วัน/เวลา/ห้อง </div></a>
        </div>

        <div class="welcome">
            <div class="welcome-text">
                <h3>ยินดีต้อนรับ! เริ่มต้นกรอกข้อมูลโครงงานของคุณได้เลย</h3>
                <p>อย่าลืมใส่รายละเอียดทุกช่องและตรวจสอบความให้ถูกต้องก่อนกดยื่น</p>
            </div>
            <img src="../images/images8.png" alt="Illustration">
        </div>

        <div class="tasks">
            <p>กรอกข้อมูลเพื่อยื่นสอบจบ</p>
            <div class="taskk">
                    <form>
                        <label>ชื่อ-นามสกุล :</label>
                        <input type="text" name="submitName" required>

                        <label>รหัสนักศึกษา :</label>
                        <input type="text" name="StudentID" required>

                        <label>ผู้ทำโครงงาน :</label>
                        <select id="memberCount" onchange="toggleMembers()" required>
                            <option value="" disabled selected hidden>กรุณาระบุ</option>
                            <option value="1">1 คน</option>
                            <option value="2">2 คน</option>
                            <option value="3">3 คน</option>
                            <option value="4">4 คน</option>
                        </select>
                        
                        <div id="member1">
                            <label>1. ชื่อ :</label>
                            <input type="text" name="member1_name" required>
                            <label>นามสกุล :</label>
                            <input type="text" name="member1_name" required>
                            <label>รหัสนักศึกษา :</label>
                            <input type="text" name="member1_id" required> 
                            <label>สาขา :</label>
                            <select required>
                                <option value="" disabled selected hidden>กรุณาระบุ</option>
                                <option value="IT">IT</option>
                                <option value="ITI">ITI</option>
                                <option value="INE">INE</option>
                                <option value="INET">INET</option>
                            </select>
                        </div>

                        <div id="member2" style="display: none;">
                            <label>2. ชื่อ :</label>
                            <input type="text" name="member2_name" required>
                            <label>นามสกุล :</label>
                            <input type="text" name="member2_name" required>
                            <label>รหัสนักศึกษา :</label>
                            <input type="text" name="member2_id" required>
                            <label>สาขา:</label>
                            <select required>
                                <option value="" disabled selected hidden>กรุณาระบุ</option>
                                <option value="IT">IT</option>
                                <option value="ITI">ITI</option>
                                <option value="INE">INE</option>
                                <option value="INET">INET</option>
                            </select>
                        </div>

                        <div id="member3" style="display: none;">
                            <label>3. ชื่อ :</label>
                            <input type="text" name="member2_name" required>
                            <label>นามสกุล :</label>
                            <input type="text" name="member2_name" required>
                            <label>รหัสนักศึกษา :</label>
                            <input type="text" name="member2_id" required>
                            <label>สาขา:</label>
                            <select required>
                                <option value="" disabled selected hidden>กรุณาระบุ</option>
                                <option value="IT">IT</option>
                                <option value="ITI">ITI</option>
                                <option value="INE">INE</option>
                                <option value="INET">INET</option>
                            </select>
                        </div>

                        <div id="member4" style="display: none;">
                            <label>4. ชื่อ :</label>
                            <input type="text" name="member2_name" required>
                            <label>นามสกุล :</label>
                            <input type="text" name="member2_name" required>
                            <label>รหัสนักศึกษา :</label>
                            <input type="text" name="member2_id" required>
                            <label>สาขา:</label>
                            <select required>
                                <option value="" disabled selected hidden>กรุณาระบุ</option>
                                <option value="IT">IT</option>
                                <option value="ITI">ITI</option>
                                <option value="INE">INE</option>
                                <option value="INET">INET</option>
                            </select>
                        </div>

                        <label>ชื่อโครงงาน :</label>
                        <input type="text" name="project_th" required>

                        <label>ชื่อโครงงาน (ภาษาอังกฤษ) :</label>
                        <input type="text" name="project_th" required>


                        <label>อาจารย์ที่ปรึกษา :</label>
                        <input type="text" name="project_ad" required>

                        <label>อาจารย์ที่ปรึกษาโครงาน :</label>
                        <input type="text" name="project_ad" required>

                        <label>ประเภทโครงงาน :</label>
                        <select required>
                            <option value="" disabled selected hidden>กรุณาระบุ</option>
                            <option value="โครงงานพิเศษ">โครงงานพิเศษ</option>
                            <option value="โครงงานสหกิจ">โครงงานพิเศษ</option>
                        </select>

                        <label>เลือกกรรมการ 3 ท่าน</label>
                        <select name="committee1" required>
                            <option value="" disabled selected>กรรมการ 1</option>
                            <option value="Teacher A">Teacher A</option>
                            <option value="Teacher B">Teacher B</option>
                            <option value="Teacher C">Teacher C</option>
                        </select>
                        <select name="committee2" required>
                            <option value="" disabled selected>กรรมการ 2</option>
                            <option value="Teacher A">Teacher A</option>
                            <option value="Teacher B">Teacher B</option>
                            <option value="Teacher C">Teacher C</option>
                        </select>
                        <select name="committee3" required>
                            <option value="" disabled selected>กรรมการ 3</option>
                            <option value="Teacher A">Teacher A</option>
                            <option value="Teacher B">Teacher B</option>
                            <option value="Teacher C">Teacher C</option>
                        </select>
                        
                        <label>Upload เล่มโครงงาน (PDF)</label>
                        <input type="file" name="projectFile" accept=".pdf" required>

                        <label>Upload Presentation (PDF)</label>
                        <input type="file" name="presentationFile" accept=".pdf" required>

                        <div class="btn-group">
                            <button type="reset" class="btn-reset">แก้ไข</button>
                            <a href="../html/date_time_room.html" class="btn-submit">ถัดไป</a>
                        </div>
                    </form>
            </div>
        </div>
    </div>
    <script>
        function toggleMembers() {
            const count = parseInt(document.getElementById("memberCount").value); 
            for (let i = 1; i <= 4; i++) {
                const memberDiv = document.getElementById("member" + i);
                if (i <= count) {
                    memberDiv.style.display = "block";  
                } else {
                    memberDiv.style.display = "none";  
                }
            }
        }
    </script>
</body>
