<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style2.css">
    <title>Index</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="login-box">
            <h1>ยินดีต้อนรับ!</h1>
            <p>ระบบติดตามโครงงานสหกิจและโครงงานพิเศษ <b>Project go</b>. Get started.</p>
            <input type="text" placeholder="Username">
            <input type="password" placeholder="Password">
            <div class="role"><a href="role.html" class="btn">Login</a></div>
            <div class="alt">or continue with</div>
            <div class="social">
              <button>G</button>
              <button>f</button>
            </div>
            <div class="register">Not a member? <a href="#">Register now</a></div>
        </div>

      
        <div class="slider-box">
            <div class="swiper">
              <div class="swiper-wrapper">
                <div class="swiper-slide">
                  <img src="../images/images3.png" alt="slide1">
                </div>
                <div class="swiper-slide">
                  <img src="../images/images4.png" alt="slide2">
                </div>
                <div class="swiper-slide">
                  <img src="../images/images5.png" alt="slide3">
                </div>
              </div>
              <div class="swiper-pagination"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.js"></script>
    <script>
        const swiper = new Swiper('.swiper', {
            loop: true,
                pagination: {
                el: '.swiper-pagination',
                clickable: true,
            },
                autoplay: {
                delay: 3000,
                disableOnInteraction: false,
            }
        });
    </script>
</body>
</html>
