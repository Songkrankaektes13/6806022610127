<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style2.css">
    <title>Role</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="role-box">
            <div class="logo-img">
                <img src="../images/images1.png" width="250" height="auto">
            </div>
            <p>ยินดีต้อนรับ! สู่ระบบติดตามโครงงานพิเศษและโครงงานสหกิจ <b>Project go</b>. Get started.</p>
            <div class="roles">
                <a href="../html/student/deshboard.html"><button class="role">นักศึกษา</button></a>
                <a href="../html/advisor/deshboard.html"><button class="role">อาจารย์ที่ปรึกษา/อาจารย์ที่ปรึกษาโครงาน</button></a>
                <a href="../html/commitee/deshboard_cmt.html"><button class="role">กรรมการ</button></a>
            </div>
            <div class="back">
                <a href="../html/register.html" class="btn">ย้อนกลับ</a>
            </div>
        </div>
    
        <div class="slider-box">
            <div class="swiper">
              <div class="swiper-wrapper">
                <div class="swiper-slide">
                  <img src="../images/images3.png" alt="slide1">
                </div>
                <div class="swiper-slide">
                  <img src="../images/images4.png" alt="slide2">
                </div>
                <div class="swiper-slide">
                  <img src="../images/images5.png" alt="slide3">
                </div>
              </div>
              <div class="swiper-pagination"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.js"></script>
    <script>
        const swiper = new Swiper('.swiper', {
            loop: true,
                pagination: {
                el: '.swiper-pagination',
                clickable: true,
            },
                autoplay: {
                delay: 3000,
                disableOnInteraction: false,
            }
        });
    </script>
</body>
</html>
