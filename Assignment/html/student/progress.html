    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <div class="dashboard">
        <div class="header">
            <img src="../../images/images1.png" class="logo" alt="logo">
            <div class="header-right">
                <span>Guest</span>
                <div class="profile-icon">
                     <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="white">
                        <path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 
                                2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 
                                1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"/>
                     </svg>
                </div>

                <a href="../../html/student/notifications.html" class="bell-link">
                  <i class="fa-solid fa-bell"></i>
                </a>
            </div>
        </div>
        
        <div class="welcome">
            <div class="welcome-text">
                <h3>📊 ความก้าวหน้าโครงงาน</h3>
                <p>อย่าลืมใส่รายละเอียดทุกช่องและตรวจสอบความถูกต้องก่อนกดยืนยันความก้าวหน้าของคุณ</p>
            </div>
            <img src="../../images/images6.png" alt="Illustration">
        </div>

        <div class="boxs">
            <div class="black-box">ความก้าวหน้าโครงงาน</div>
        </div>

        <div class="tasks">
            <p>กรอกข้อมูลความก้าวหน้า</p>
            <div class="taskk">
                    <form>
                        <label>สัปดาห์ :</label>
                        <select required>
                            <option value="" disabled selected hidden>กรุณาระบุ</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                            <option value="9">9</option>
                            <option value="10">10</option>
                            <option value="11">11</option>
                            <option value="12">12</option>
                            <option value="13">13</option>
                            <option value="14">14</option>
                            <option value="15">15</option>
                        </select>

                        <label>งานที่ทำแล้ว :</label>
                        <textarea name="done" rows="2" required></textarea>

                        <label>ปัญหา/อุปสรรค :</label>
                        <textarea name="problems" rows="2" required></textarea>

                        <label>แผนถัดไป :</label>
                        <textarea name="next" rows="2" required></textarea>

                        <label>% ความก้าวหน้า (นักศึกษา):</label>
                        <input type="number" name="percent" min="0" max="100" required>

                        <label>อัปโหลดไฟล์ :</label>
                        <input type="file" name="file">

                        <div class="btn-group">
                            <button type="reset" class="btn-reset">แก้ไข</button>
                            <button type="submit" class="btn-submit">ยื่นยัน</button>
                        </div>

                    </form>
            </div>
        </div>
    </div>  
</body>
